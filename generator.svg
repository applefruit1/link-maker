
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xhtml="http://www.w3.org/1999/xhtml"
     width="700" height="480" viewBox="0 0 700 480">

  <rect width="700" height="480" rx="22" fill="#0f172a"/>

  <text x="40" y="58" fill="#ffffff" font-size="30"
        font-family="Arial" font-weight="bold">
    SVG Generator
  </text>

  <text x="40" y="88" fill="#94a3b8" font-size="16"
        font-family="Arial">
    Generate SVG files in your GitHub repository
  </text>

  <rect x="30" y="115" width="640" height="325" rx="16"
        fill="#1e293b" stroke="#334155"/>

  <text x="55" y="158" fill="#f8fafc" font-size="17"
        font-family="Arial">
    Number of SVG files
  </text>

  <foreignObject x="55" y="175" width="590" height="55">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <input id="count" type="number" min="1" max="1000"
             value="10"
             style="width:100%;box-sizing:border-box;padding:13px;
                    font-size:18px;border-radius:8px;
                    border:1px solid #475569;background:#0f172a;
                    color:white"/>
    </div>
  </foreignObject>

  <foreignObject x="55" y="250" width="590" height="65">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <button id="generate"
        style="width:100%;padding:16px;border:0;border-radius:8px;
               background:#3b82f6;color:white;font-size:17px;
               font-weight:bold;cursor:pointer">
        Generate SVGs
      </button>
    </div>
  </foreignObject>

  <text x="55" y="347" fill="#cbd5e1" font-size="14"
        font-family="Arial">
    Enter any number from 1 to 1000.
  </text>

  <text x="55" y="375" fill="#94a3b8" font-size="13"
        font-family="Arial">
    Repository: applefruit1/svg-link-generator
  </text>

  <a href="https://github.com/applefruit1/svg-link-generator/actions"
     target="_blank">
    <rect x="55" y="393" width="590" height="32" rx="7"
          fill="#334155"/>
    <text x="350" y="414" text-anchor="middle"
          fill="#ffffff" font-family="Arial" font-size="14">
      Open GitHub Actions
    </text>
  </a>
</svg>
